# config.yaml

# Input/Output files (relative paths)
ohlc_csv: "all_pairs_ohlc.csv"
output_csv: "predictions.csv"
contracts_csv: "filtered_contracts.csv"
# Models (relative paths)
Trade_py: "trade.py"
classifier_model: "models/model_classifier.pkl"
regressor_model: "models/model_regressor.pkl"

# Parameters
prob_threshold: 0.62

# Feature set (must stay in sync with ai/ohlc_predictor.prepare_features
#              and models/train_models.py FEATURES list)
features:
  - open
  - high
  - low
  - close
  - volume
  - return
  - return_3
  - return_10
  - rolling_vol
  - rolling_mean
  - volume_ratio
  - body_ratio
  - close_vs_mean


DB_PATH2: "db_files/dex_pipeline_local_mod.db"
DB_PATH: "db_files/dex_pipeline.db"
BRIDGE_PATH: "db_bridge/bridge-aws.py"